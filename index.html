<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uploader</title>
<style>
body{margin:0;font-family:sans-serif;background:#111;color:#eee;display:flex;flex-direction:column;height:100vh}
#list{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.item{background:#222;border-radius:12px;padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
.item a{color:#5cf;text-decoration:none;font-size:20px}
#bar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%)}
#bar label{background:#333;color:#fff;padding:14px 28px;border-radius:32px;cursor:pointer;font-size:16px}
</style>
</head>
<body>
<div id="list"></div>
<div id="bar">
  <label for="f">⬆ Upload</label>
  <input id="f" type="file" multiple style="display:none" onchange="add(this.files)">
</div>
<script>
function add(files){
  const list=document.getElementById('list');
  [...files].forEach(f=>{
    const url=URL.createObjectURL(f);
    const div=document.createElement('div');
    div.className='item';
    div.innerHTML=`<span>${f.name}</span><a href="${url}" download="${f.name}">⬇</a>`;
    list.prepend(div);
  });
}
</script>
</body>
</html>
