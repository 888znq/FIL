<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uploader</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:sans-serif;background:#111;color:#eee;display:flex;flex-direction:column;height:100vh}
#list{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.item{background:#222;border-radius:12px;padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
.item a{color:#5cf;text-decoration:none;font-size:20px}
#bar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%)}
#bar label{background:#333;color:#fff;padding:14px 28px;border-radius:32px;cursor:pointer;font-size:16px}
</style>
</head>
<body>
<div id="list"></div>
<div id="bar">
  <label for="f">⬆ Upload</label>
  <input id="f" type="file" multiple style="display:none" onchange="upload(this.files)">
</div>
<script>
const sb = supabase.createClient(
  'https://vrtzhpnvijjzvbsewdmb.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZydHpocG52aWpqenZic2V3ZG1iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3OTQ0NjIsImV4cCI6MjEwMDM3MDQ2Mn0.QD0jcEKFRHo8Of0lfYbS6p1XKZRxGM9e2sYIpMsiPtI'
);
const BUCKET = 'docs';

async function refresh(){
  const { data } = await sb.storage.from(BUCKET).list('', { sortBy: { column: 'created_at', order: 'desc' } });
  const list = document.getElementById('list');
  list.innerHTML = '';
  (data || []).filter(f => f.id).forEach(f => {
    const { data: { publicUrl } } = sb.storage.from(BUCKET).getPublicUrl(f.name);
    const name = f.name.includes('_') ? f.name.slice(f.name.indexOf('_') + 1) : f.name;
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `<span>${name}</span><a href="${publicUrl}" download="${name}">⬇</a>`;
    list.appendChild(div);
  });
}

async function upload(files){
  for (const f of [...files]) {
    await sb.storage.from(BUCKET).upload(`${Date.now()}_${f.name}`, f);
  }
  refresh();
}

refresh();
</script>
</body>
</html>
